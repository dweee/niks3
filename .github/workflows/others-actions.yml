name: Native others package cache
"on":
  push:
    branches:
      - flakey
  pull_request: null
  workflow_dispatch:
    inputs:
      package:
        description: Package or check attribute, or all for every native output
        required: true
        default: all
        type: string
      nixpkgs_revision:
        description: Optional exact public nixpkgs commit for consumer-cache reproduction
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: niks3-others-${{ github.ref }}-${{ inputs.package || 'all' }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ vars.DAVE_FORK_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Attic publication handling without credentials
        run: |
          python3 ci/test-push-attic.py
          python3 ci/test-transfer-attic.py
          python3 ci/test-public-closure.py
          python3 ci/test-configure-attic-read.py
          python3 ci/test-native-inventory.py
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
            accept-flake-config = false
      - name: Verify Determinate client and daemon
        run: |
          nix --version | grep -F "Determinate Nix 3.24.1"
          nix store info --store daemon --json
      - id: matrix
        env:
          SELECTED_PACKAGE: ${{ inputs.package || 'all' }}
        run: |
          matrix=$(python3 ci/matrix.py others --package "$SELECTED_PACKAGE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: ${{ needs.plan.outputs.has_jobs == 'true' }}
    name: ${{ matrix.set }}.${{ matrix.package }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Reclaim unused hosted Linux SDK space for package and kernel builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / /nix || true
      - name: Reserve swap for native ARM RustFS linking
        if: ${{ matrix.system == 'aarch64-linux' }}
        run: |
          set -euo pipefail
          # RustFS thin-LTO compiler processes were terminated on hosted ARM.
          # Keep its existing recipe and tests; bound parallelism and add memory.
          free -h
          swap_kib=$(awk '/^SwapTotal:/ { print $2 }' /proc/meminfo)
          if [ "$swap_kib" -lt 16777216 ]; then
            swap_file=/var/lib/niks3-native-ci.swap
            test ! -e "$swap_file" && test ! -L "$swap_file"
            free_kib=$(df -Pk /var/lib | awk 'NR == 2 { print $4 }')
            test "$free_kib" -ge 33554432 || { echo 'ARM native build requires 32 GiB free before reserving swap' >&2; exit 1; }
            sudo install -m 600 /dev/null "$swap_file"
            sudo fallocate -l 16G "$swap_file"
            sudo mkswap "$swap_file"
            sudo swapon "$swap_file"
          fi
          free -h
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: ${{ matrix.kvm }}
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
            accept-flake-config = false
            substituters = https://cache.nixos.org/
            extra-substituters =
            extra-trusted-public-keys = niks3.monke.fail-1:q13GqiZgAxx7SyoLZInXoJjviZMOdNpfG03xs0VUD2M=
            max-jobs = 1
            cores = ${{ matrix.system == 'aarch64-linux' && '1' || '3' }}
      - name: Verify Determinate client and daemon
        run: |
          nix --version | grep -F "Determinate Nix 3.24.1"
          nix store info --store daemon --json
      - name: Select optional exact public nixpkgs revision
        env:
          BUILD_NIXPKGS_REVISION: ${{ inputs.nixpkgs_revision }}
        run: python3 ci/select-build-nixpkgs.py
      - name: Configure read-only Niks3 access with GitHub OIDC
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: python3 ci/configure-niks3.py --oidc
      - name: Evaluate and build every output of the native target
        env:
          TARGET_SET: ${{ matrix.set }}
          TARGET_SYSTEM: ${{ matrix.system }}
          TARGET_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$TARGET_SYSTEM"
          target=".#$TARGET_SET.$TARGET_SYSTEM.$TARGET_PACKAGE"
          python3 ci/public-closure.py "$target"
          SECONDS=0
          python3 ci/retain-build-outputs.py --target "$target" --manifest cache-outputs.txt -- nix build "$target^*" --fallback --no-update-lock-file --no-write-lock-file --no-link --print-out-paths -L > outputs.txt
          {
            echo "Built $TARGET_PACKAGE for $TARGET_SYSTEM"
            echo "Package build: ${SECONDS}s"
            cat outputs.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the selected native executable or container archive
        if: ${{ matrix.set == 'packages' }}
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
          TARGET_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          root=$(nix eval --raw --no-update-lock-file --no-write-lock-file ".#packages.$TARGET_SYSTEM.$TARGET_PACKAGE.outPath")
          grep -Fx -- "$root" outputs.txt
          python3 ci/verify-native-output.py "$TARGET_PACKAGE" "$root"
      - name: Remove private read credentials before exporting build data
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup
      - name: Save selected runtime closures independently of cache publication
        timeout-minutes: 15
        env:
          ATTIC_MAX_CLOSURE_MIB: ${{ startsWith(matrix.package, 't3code') && (vars.ATTIC_T3_MAX_CLOSURE_MIB || '8192') || (vars.ATTIC_MAX_CLOSURE_MIB || '8192') }}
        run: python3 ci/transfer-attic.py export --directory attic-transfer --manifest cache-outputs.txt
        id: cache_transfer
        if: ${{ always() && !cancelled() && hashFiles('cache-outputs.txt') != '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-${{ matrix.system }}-${{ matrix.set }}-${{ matrix.package }}-${{ github.sha }}
          path: attic-transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: false
        if: ${{ always() && !cancelled() && steps.cache_transfer.outcome == 'success' }}
    permissions:
      contents: read
      id-token: write
  publish:
    permissions:
      contents: read
      id-token: write
    needs:
      - plan
      - build
    if: ${{ always() && !cancelled() && ((needs.build.result == 'success' || needs.build.result == 'failure') && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && needs.plan.outputs.has_jobs == 'true' && (vars.NIKS3_PUSH_ENABLED || vars.ATTIC_PUSH_ENABLED) == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    name: Publish ${{ matrix.package }} (${{ matrix.system }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
            accept-flake-config = false
            substituters = https://cache.nixos.org/
            extra-substituters =
      - name: Verify Determinate client and daemon
        run: |
          nix --version | grep -F "Determinate Nix 3.24.1"
          nix store info --store daemon --json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nix-${{ matrix.system }}-${{ matrix.set }}-${{ matrix.package }}-${{ github.sha }}
          path: attic-transfer
      - name: Read Niks3 before installing the pinned publisher
        run: python3 ci/configure-niks3.py --oidc
      - name: Install pinned Niks3 publisher
        run: bash ci/install-niks3.sh --retain-bootstrap
      - name: Publish bootstrap client and completed build dependencies
        run: python3 ci/push-niks3.py --outputs niks3-bootstrap-outputs.txt
      - name: Import data without running any package programs
        timeout-minutes: 15
        env:
          ATTIC_MAX_CLOSURE_MIB: ${{ startsWith(matrix.package, 't3code') && (vars.ATTIC_T3_MAX_CLOSURE_MIB || '8192') || (vars.ATTIC_MAX_CLOSURE_MIB || '8192') }}
        run: python3 ci/transfer-attic.py import --directory attic-transfer
      - name: Publish to Niks3 with GitHub OIDC and verify S3 integrity
        run: python3 ci/push-niks3.py --outputs attic-transfer/outputs.txt
      - name: Remove job-local Niks3 reader
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup

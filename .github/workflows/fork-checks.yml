name: Fork checks
on:
  pull_request:
  push:
    branches: [flakey]
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
      - name: Configure read-only Niks3 for trusted default-branch checks
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: python3 ci/configure-niks3.py --oidc
      - name: Validate OIDC audience and scope isolation
        run: nix shell --no-write-lock-file --inputs-from . nixpkgs#go nixpkgs#stdenv.cc -c go test ./server/oidc ./cmdutil
      - name: Validate queued output retention and races
        run: nix shell --no-write-lock-file --inputs-from . nixpkgs#go nixpkgs#stdenv.cc -c go test -race ./hook ./cmd/niks3-hook
      - name: Remove job-local Niks3 reader
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup
